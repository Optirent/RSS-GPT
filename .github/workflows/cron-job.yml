name: OPTIRENT RSS-Feed

on:
  workflow_dispatch:
  push:
    paths:
      - 'config.ini'
      - 'main.py'
      - '.github/workflows/cron-job.yml'
  schedule:
    - cron: '0 5 * * *'

concurrency:
  group: optirent-rss-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run OPTIRENT filter tests
        run: python -m unittest test_optirent_filter.py -v
      - name: Build OPTIRENT RSS
        env:
          U_NAME: Optirent
        run: python main.py
      - name: Save generated RSS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ README.md README-zh.md
          if ! git diff --cached --quiet; then
            git commit -m "Update OPTIRENT RSS"
            git pull --rebase origin main
            git push
          fi
